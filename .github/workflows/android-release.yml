name: Build APK & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compute version & tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode = .*/versionCode = ${GITHUB_RUN_NUMBER}/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${VERSION}\"/" app/build.gradle.kts

      - name: Create .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            SP="$SECRET_STORE_PASSWORD"
            KP="${SECRET_KEY_PASSWORD:-$SECRET_STORE_PASSWORD}"
            echo "Using keystore from secrets"
          else
            echo "::warning::No keystore secrets found - generating a temporary key."
            SP=$(openssl rand -hex 12); KP="$SP"
            keytool -genkeypair -v -keystore "$KS" -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SP" -keypass "$KP" \
              -dname "CN=MotionEase, O=MotionEase, C=US"
          fi
          echo "::add-mask::$SP"
          echo "::add-mask::$KP"
          {
            echo "KEYSTORE_PATH=$KS"
            echo "STORE_PASSWORD=$SP"
            echo "KEY_PASSWORD=$KP"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          OUT="MotionEase-${{ steps.ver.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.file }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Motion Ease ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.file }}
